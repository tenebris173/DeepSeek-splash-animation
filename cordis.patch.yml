# dsh-splash-animation — bundle patch
#
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件的 patch，
# 本文件把开屏动画插件插入当前 profile 的配置树。
#
# 安装：
#   dsh plugin --profile <你的 profile> add github:tenebris173/DeepSeek-splash-animation
# 或本地开发（用你 clone 下来的目录）：
#   dsh plugin --profile <你的 profile> add <本目录绝对路径>
#
# 桌面版通常不需要写 --profile：它会自己决定用哪个 profile。
#
# 配置示例（覆盖行来改 config；只写想改的字段）：
#   - id: dsh-splash-animation
#     name: dsh-splash-animation
#     config:
#       folder: C:/Users/你/.dsh/dsh-splash-animation/media
#       random: true
#       skip: click
#       muted: false
#
# 完整字段见 README.md 的「配置」一节。

- insert:
    - id: dsh-splash-animation
      name: dsh-splash-animation
